[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "ela-du-91", email = "eleanor.liard@gmail.com" },
  { name = "MaximeDespreaux", email = "despreaux.maxime04@gmail.com" },
  { name = "ZixiaoGuo-China", email = "zixiaoguo1@gmail.com" },
  { name = "justinmartin", email = "justin.martin@polytechnique.edu" }
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pydantic>=2.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.10.0",
    "mlflow>=3.17.2",
    "pre-commit>=4.0",
    "ruff>=0.12.0",
    "setuptools<81",
    "ydata-profiling>=4.18.4",
]

[tool.uv]
package = false
